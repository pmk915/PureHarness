[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniharness"
version = "0.1.0"
description = "A minimal, inspectable agent harness built from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
cli = [
    "rich>=14.2",
]

dev = [
    "pytest>=8",
]

[project.scripts]
miniharness = "miniharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
